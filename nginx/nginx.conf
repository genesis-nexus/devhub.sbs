# Main Nginx Configuration for Multi-Site Reverse Proxy
# This is the main nginx.conf that should be placed at /etc/nginx/nginx.conf
# It contains global settings shared across all sites

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # Hide nginx version

    # Server names
    server_names_hash_bucket_size 64;
    server_names_hash_max_size 512;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Character Set
    ##
    charset utf-8;

    ##
    # SSL Settings (applied globally)
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ##
    # Logging Settings
    ##
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format proxy '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" '
                     'upstream: $upstream_addr '
                     'response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;

    ##
    # Gzip Settings (Global)
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    ##
    # Security Headers (Global defaults - can be overridden per site)
    ##
    # These are set in individual site configs to allow customization

    ##
    # Proxy Settings (for reverse proxy functionality)
    ##
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Proxy buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    ##
    # Rate Limiting (optional - uncomment to enable)
    ##
    # limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # limit_conn_zone $binary_remote_addr zone=addr:10m;

    ##
    # Upstream Definitions (add backend servers here)
    # Example:
    # upstream myapp_backend {
    #     server 127.0.0.1:3000;
    #     keepalive 32;
    # }
    ##

    ##
    # Virtual Host Configs
    # All site configurations are loaded from sites-enabled
    ##
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
