# Nginx configuration for DevHub.sbs
# Multi-site compatible configuration
# Place this file at: /etc/nginx/sites-available/devhub.conf
#
# NOTE: This config uses default_server so it works with both:
#   - Direct IP access (http://YOUR_IP)
#   - Domain access (http://devhub.sbs)
#
# When adding more sites, remove 'default_server' from this config
# and deploy nginx/default.conf as 00-default.conf instead.

server {
    # default_server: Remove this when you have multiple sites and use 00-default.conf
    listen 80 default_server;
    listen [::]:80 default_server;

    # Domain configuration
    # The underscore (_) acts as catch-all when this is the only/default site
    # Once you add more sites, change to: server_name devhub.sbs www.devhub.sbs;
    server_name devhub.sbs www.devhub.sbs _;

    # Document root - where your static files are located
    root /var/www/devhub.sbs/docs;

    # Default index file
    index index.html index.htm;

    # Logging (per-site logs)
    access_log /var/log/nginx/devhub-access.log;
    error_log /var/log/nginx/devhub-error.log;

    # Main location block - serve static files
    location / {
        # Try to serve file, then directory, then fall back to index.html (SPA support)
        try_files $uri $uri/ /index.html;
    }

    # Security: Deny access to hidden files (files starting with .)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Special files
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        add_header Content-Type "application/xml; charset=UTF-8";
        log_not_found off;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
