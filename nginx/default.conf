# Default Server Configuration
# Catches all requests that don't match any other server block
# This should be enabled to handle undefined domains and IP-based access
#
# Place at: /etc/nginx/sites-available/00-default.conf
# The "00-" prefix ensures it loads first but doesn't catch valid domains

server {
    # Listen on port 80 as default server (catches unmatched requests)
    listen 80 default_server;
    listen [::]:80 default_server;

    # Catch-all server name
    server_name _;

    # Default document root for fallback page
    root /var/www/default;
    index index.html;

    # Logging
    access_log /var/log/nginx/default-access.log;
    error_log /var/log/nginx/default-error.log;

    # Return a simple response for unmatched requests
    # Option 1: Show a default page (if /var/www/default/index.html exists)
    # Option 2: Return 444 (closes connection without response)
    # Option 3: Return 404 with message

    location / {
        # If you want to show a default page:
        try_files $uri $uri/ =404;

        # Alternatively, to close connection silently (security-focused):
        # return 444;

        # Or return a simple 404:
        # return 404 "Site not found";
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Minimal security headers
    add_header X-Content-Type-Options "nosniff" always;
}

